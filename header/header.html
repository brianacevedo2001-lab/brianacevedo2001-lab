<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Header animado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: #070a12; }
  body { display: grid; place-items: center; min-height: 100vh; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1280" height="320"></canvas>
<script>
/*
 * Encabezado animado del perfil. Todo se dibuja en función de t (segundos),
 * con periodo T, para que render.js pueda capturar fotogramas exactos y el GIF
 * haga un bucle sin saltos. Abierto en el navegador, se anima en tiempo real.
 */
const W = 1280, H = 320, T = 8;
const ctx = document.getElementById('c').getContext('2d');
const TAU = Math.PI * 2;

const C = {
  bg0: '#070a12', bg1: '#0c1322',
  text: '#eef2ff', dim: '#8b95b5', faint: '#3a4566',
  cyan: '#22d3ee', violet: '#a78bfa', green: '#34d399', amber: '#fbbf24',
};

const NAME_A = 'Brian ', NAME_B = 'Acevedo';
const KICKER = 'BACKEND  ·  AUTOMATIZACIÓN CON IA  ·  ANALÍTICA DE DATOS';
const PHRASES = [
  'Datos operativos → decisiones de negocio.',
  'Automatizo con IA lo que hoy se hace a mano.',
];
const CHIPS = ['Python', 'Airflow', 'Power BI', 'BigQuery', 'Claude Code · MCP'];

// Generador pseudoaleatorio con semilla: la red de nodos sale igual en cada render.
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
const rand = rng(42);

// Red de fondo (lado derecho): nodos fijos, aristas entre vecinos cercanos.
const nodes = Array.from({ length: 26 }, () => ({
  x: 620 + rand() * 640, y: 20 + rand() * 280, ph: rand(), k: 1 + Math.floor(rand() * 2),
}));
const edges = [];
nodes.forEach((a, i) => nodes.forEach((b, j) => {
  if (j > i && Math.hypot(a.x - b.x, a.y - b.y) < 135) edges.push({ a, b, ph: rand(), k: 1 + Math.floor(rand() * 2) });
}));

const frac = x => x - Math.floor(x);
const clamp01 = x => Math.max(0, Math.min(1, x));
const ease = x => 1 - Math.pow(1 - clamp01(x), 3);
const wave = (t, k = 1, ph = 0) => Math.sin(TAU * (t / T * k + ph)); // periódica en T

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function background(t) {
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, C.bg0); g.addColorStop(1, C.bg1);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // Resplandores que respiran
  const glow = (x, y, r, color, a) => {
    const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, color.replace('A', a)); rg.addColorStop(1, color.replace('A', 0));
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  };
  glow(1010, 150, 380, 'rgba(34,211,238,A)', 0.10 + 0.04 * wave(t));
  glow(140, 40, 360, 'rgba(167,139,250,A)', 0.09 + 0.03 * wave(t, 1, 0.5));

  // Retícula de puntos
  ctx.fillStyle = 'rgba(139,149,181,0.10)';
  for (let x = 16; x < W; x += 32) for (let y = 16; y < H; y += 32) ctx.fillRect(x, y, 1.5, 1.5);
}

function network(t) {
  edges.forEach(e => {
    ctx.strokeStyle = 'rgba(34,211,238,0.10)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(e.a.x, e.a.y); ctx.lineTo(e.b.x, e.b.y); ctx.stroke();
    // Pulso de datos viajando por la arista
    const p = frac(t / T * e.k + e.ph);
    const x = e.a.x + (e.b.x - e.a.x) * p, y = e.a.y + (e.b.y - e.a.y) * p;
    const a = Math.sin(Math.PI * p) * 0.9;
    ctx.fillStyle = `rgba(103,232,249,${a})`;
    ctx.beginPath(); ctx.arc(x, y, 1.8, 0, TAU); ctx.fill();
  });
  nodes.forEach(n => {
    const s = 0.5 + 0.5 * wave(t, n.k, n.ph);
    ctx.fillStyle = `rgba(167,139,250,${0.25 + 0.5 * s})`;
    ctx.beginPath(); ctx.arc(n.x, n.y, 2 + 1.5 * s, 0, TAU); ctx.fill();
  });
}

function textBlock(t) {
  const x0 = 72;

  // Barra de acento vertical con brillo que la recorre
  const bar = ctx.createLinearGradient(0, 62, 0, 250);
  bar.addColorStop(0, C.cyan); bar.addColorStop(1, C.violet);
  ctx.fillStyle = bar; ctx.globalAlpha = 0.85; ctx.fillRect(x0 - 26, 66, 3, 182); ctx.globalAlpha = 1;
  const by = 66 + frac(t / T * 2) * 182;
  const bg = ctx.createRadialGradient(x0 - 24.5, by, 0, x0 - 24.5, by, 14);
  bg.addColorStop(0, 'rgba(255,255,255,0.9)'); bg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = bg; ctx.fillRect(x0 - 40, by - 14, 30, 28);

  // Kicker
  ctx.font = '600 13px "JetBrains Mono"'; ctx.fillStyle = C.cyan; ctx.textBaseline = 'alphabetic';
  if ('letterSpacing' in ctx) ctx.letterSpacing = '2px';
  ctx.fillText(KICKER, x0, 84);
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';

  // Nombre: "Brian" blanco + "Acevedo" en degradado
  ctx.font = '700 78px "Space Grotesk"';
  const wA = ctx.measureText(NAME_A).width, wB = ctx.measureText(NAME_B).width;
  const yName = 168;
  ctx.fillStyle = C.text; ctx.fillText(NAME_A, x0, yName);
  const ng = ctx.createLinearGradient(x0 + wA, 0, x0 + wA + wB, 0);
  ng.addColorStop(0, C.cyan); ng.addColorStop(1, C.violet);
  ctx.fillStyle = ng; ctx.fillText(NAME_B, x0 + wA, yName);

  // Barrido de brillo sobre el nombre (primeros 1.6 s de cada ciclo)
  const sweep = clamp01(t / 1.6);
  if (sweep > 0 && sweep < 1) {
    const sx = x0 - 120 + (wA + wB + 240) * sweep;
    // Repinta el texto con una banda blanca que se desvanece en los bordes
    const sg = ctx.createLinearGradient(sx - 70, 0, sx + 70, 0);
    sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(0.5, 'rgba(255,255,255,0.95)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sg;
    ctx.fillText(NAME_A + NAME_B, x0, yName);
  }

  // Línea tipeada: frase A (0–4 s) y frase B (4–8 s)
  const half = T / 2, local = t % half, phrase = PHRASES[t < half ? 0 : 1];
  let n;
  if (local < 1.7) n = Math.round(phrase.length * (local / 1.7));
  else if (local < 3.5) n = phrase.length;
  else n = Math.round(phrase.length * (1 - (local - 3.5) / 0.5));
  const shown = phrase.slice(0, Math.max(0, n));
  ctx.font = '500 25px "Space Grotesk"'; ctx.fillStyle = C.dim;
  ctx.fillStyle = '#5eead4'; ctx.fillText('>', x0, 216);
  ctx.fillStyle = '#c7d2fe'; ctx.fillText(shown, x0 + 24, 216);
  const cw = ctx.measureText(shown).width;
  if (frac(t * 1.75) < 0.6 || (local < 1.7 || local > 3.5)) {
    ctx.fillStyle = C.cyan; ctx.fillRect(x0 + 28 + cw, 196, 12, 25);
  }

  // Chips de stack
  ctx.font = '500 13px "JetBrains Mono"';
  let cx = x0;
  CHIPS.forEach((label, i) => {
    const w = ctx.measureText(label).width + 22;
    const lit = 0.5 + 0.5 * wave(t, 1, -i / CHIPS.length);
    roundRect(cx, 244, w, 28, 14);
    ctx.fillStyle = `rgba(34,211,238,${0.05 + 0.07 * lit})`; ctx.fill();
    ctx.strokeStyle = `rgba(34,211,238,${0.25 + 0.4 * lit})`; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#cfe9f1'; ctx.fillText(label, cx + 11, 263);
    cx += w + 10;
  });
}

function dashboardCard(t) {
  const x = 878, y = 52, w = 340, h = 216;
  ctx.save();
  ctx.shadowColor = 'rgba(34,211,238,0.25)'; ctx.shadowBlur = 30;
  roundRect(x, y, w, h, 16); ctx.fillStyle = 'rgba(12,19,34,0.92)'; ctx.fill();
  ctx.restore();
  roundRect(x, y, w, h, 16); ctx.strokeStyle = 'rgba(167,139,250,0.35)'; ctx.lineWidth = 1; ctx.stroke();

  // Barra de título tipo ventana
  [C.violet, C.cyan, C.green].forEach((c, i) => {
    ctx.fillStyle = c; ctx.globalAlpha = 0.8; ctx.beginPath(); ctx.arc(x + 20 + i * 14, y + 20, 4, 0, TAU); ctx.fill();
  });
  ctx.globalAlpha = 1;
  ctx.font = '500 12px "JetBrains Mono"'; ctx.fillStyle = C.dim;
  ctx.fillText('dag: reportes_diarios', x + 70, y + 24);
  // Estado del DAG: running → success, cíclico
  const ok = frac(t / T * 2) > 0.55;
  ctx.fillStyle = ok ? C.green : C.amber;
  ctx.fillText(ok ? '● success' : '● running', x + w - 92, y + 24);

  // Pipeline IMAP → Airflow → Power BI con paquetes de datos fluyendo
  const steps = ['IMAP', 'Airflow', 'Power BI'];
  const sx = [x + 22, x + 132, x + 242], sy = y + 44, sw = 78, sh = 28;
  for (let i = 0; i < 2; i++) {
    const ax = sx[i] + sw, bx = sx[i + 1], my = sy + sh / 2;
    ctx.strokeStyle = 'rgba(139,149,181,0.35)'; ctx.setLineDash([3, 4]);
    ctx.beginPath(); ctx.moveTo(ax + 2, my); ctx.lineTo(bx - 2, my); ctx.stroke(); ctx.setLineDash([]);
    for (let k = 0; k < 2; k++) {
      const p = frac(t / T * 4 + k / 2 + i * 0.25);
      ctx.fillStyle = `rgba(34,211,238,${Math.sin(Math.PI * p)})`;
      ctx.beginPath(); ctx.arc(ax + (bx - ax) * p, my, 2.6, 0, TAU); ctx.fill();
    }
  }
  steps.forEach((s, i) => {
    const active = Math.floor(frac(t / T * 2) * 3) === i;
    roundRect(sx[i], sy, sw, sh, 7);
    ctx.fillStyle = active ? 'rgba(34,211,238,0.16)' : 'rgba(255,255,255,0.03)'; ctx.fill();
    ctx.strokeStyle = active ? 'rgba(34,211,238,0.8)' : 'rgba(139,149,181,0.3)'; ctx.stroke();
    ctx.font = '600 12px "JetBrains Mono"'; ctx.fillStyle = active ? '#e0faff' : C.dim;
    const tw = ctx.measureText(s).width; ctx.fillText(s, sx[i] + (sw - tw) / 2, sy + 18);
  });

  // Gráfico de barras + línea de tendencia
  const gx = x + 22, gy = y + 196, gw = w - 44, gh = 104, nb = 10;
  const bw = gw / nb - 8, tops = [];
  for (let i = 0; i < nb; i++) {
    const base = 0.32 + 0.055 * i;
    const v = Math.min(0.98, base + 0.12 * wave(t, 1, i * 0.09) * (0.6 + 0.4 * Math.sin(i * 1.7)));
    const bh = gh * v, bx = gx + i * (gw / nb) + 4;
    const bgd = ctx.createLinearGradient(0, gy - bh, 0, gy);
    bgd.addColorStop(0, 'rgba(167,139,250,0.85)'); bgd.addColorStop(1, 'rgba(34,211,238,0.25)');
    ctx.fillStyle = bgd; roundRect(bx, gy - bh, bw, bh, 3); ctx.fill();
    tops.push([bx + bw / 2, gy - bh - 8]);
  }
  ctx.strokeStyle = C.cyan; ctx.lineWidth = 2; ctx.beginPath();
  tops.forEach(([px, py], i) => i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)); ctx.stroke();
  const [lx, ly] = tops[tops.length - 1];
  const pr = 4 + 3 * (0.5 + 0.5 * wave(t, 4));
  ctx.fillStyle = 'rgba(34,211,238,0.25)'; ctx.beginPath(); ctx.arc(lx, ly, pr + 4, 0, TAU); ctx.fill();
  ctx.fillStyle = '#e0faff'; ctx.beginPath(); ctx.arc(lx, ly, 3.5, 0, TAU); ctx.fill();
  ctx.lineWidth = 1;
}

window.render = t => {
  t = ((t % T) + T) % T;
  ctx.clearRect(0, 0, W, H);
  background(t); network(t); textBlock(t); dashboardCard(t);
};
window.PERIOD = T;
window.ready = document.fonts.load('700 78px "Space Grotesk"')
  .then(() => document.fonts.load('600 13px "JetBrains Mono"'))
  .then(() => document.fonts.ready);

// Vista en vivo (si no viene ?static, para capturar)
if (!location.search.includes('static')) {
  window.ready.then(() => {
    const t0 = performance.now();
    (function loop(now) { render((now - t0) / 1000); requestAnimationFrame(loop); })(t0);
  });
}
</script>
</body>
</html>
